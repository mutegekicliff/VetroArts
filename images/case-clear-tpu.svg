<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="Clear TPU Phone Case Mockup">
  <defs>
    <linearGradient id="tpu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="phone-chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glass-reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tpu-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="320" height="420" rx="16" fill="url(#tpu-bg)"/>

  <!-- Phone Case Group with Drop Shadow -->
  <g filter="url(#shadow)" transform="translate(65, 30)">
    <!-- Shock-absorbing Corner Cushions -->
    <rect x="-3" y="-3" width="196" height="366" rx="38" fill="none" stroke="url(#tpu-border)" stroke-width="6"/>

    <!-- Inner Phone Body Visible through Clear TPU -->
    <rect x="5" y="5" width="180" height="350" rx="32" fill="url(#phone-chassis)"/>

    <!-- Camera Island Cutout on Phone -->
    <rect x="18" y="20" width="62" height="66" rx="16" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <!-- Triple Camera Lenses -->
    <circle cx="34" cy="38" r="9" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="34" cy="38" r="4" fill="#0F172A"/>
    <circle cx="64" cy="38" r="9" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="64" cy="38" r="4" fill="#0F172A"/>
    <circle cx="34" cy="68" r="9" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="34" cy="68" r="4" fill="#0F172A"/>
    <circle cx="64" cy="68" r="4" fill="#F1F5F9" opacity="0.8"/> <!-- Flash -->

    <!-- Clear TPU Case Outer Layer (Transparent Polymer) -->
    <rect x="0" y="0" width="190" height="360" rx="35" fill="url(#glass-reflection)" stroke="url(#tpu-border)" stroke-width="4"/>

    <!-- Raised Camera Lip Protection -->
    <rect x="16" y="18" width="66" height="70" rx="18" fill="none" stroke="#E2E8F0" stroke-width="2.5" opacity="0.8"/>

    <!-- Specular Light Reflection Streak -->
    <path d="M 12 30 Q 95 180 30 330" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M 175 40 L 175 320" stroke="#BAE6FD" stroke-width="1.5" opacity="0.5"/>

    <!-- Micro-dot anti-watermark pattern preview -->
    <circle cx="95" cy="220" r="1.5" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="105" cy="220" r="1.5" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="100" cy="230" r="1.5" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="90" cy="230" r="1.5" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="110" cy="230" r="1.5" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>
