<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="UV-Printed and Personalised Phone Case Mockup">
  <defs>
    <linearGradient id="uv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="uv-art-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="uv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <clipPath id="case-clip">
      <rect x="0" y="0" width="190" height="360" rx="36"/>
    </clipPath>
  </defs>

  <rect width="320" height="420" rx="16" fill="url(#uv-bg)"/>

  <g filter="url(#uv-shadow)" transform="translate(65, 30)">
    <!-- Base Case Body -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="#0B132B"/>

    <!-- Clipped UV Print Artwork -->
    <g clip-path="url(#case-clip)">
      <!-- Abstract Geometric Artwork Layers -->
      <path d="M -20 180 Q 80 120 210 210 L 210 380 L -20 380 Z" fill="url(#uv-art-1)" opacity="0.85"/>
      <path d="M 0 250 Q 95 190 200 270 L 200 370 L 0 370 Z" fill="#0369A1" opacity="0.9"/>
      <circle cx="150" cy="140" r="50" fill="#38BDF8" opacity="0.3"/>
      <circle cx="150" cy="140" r="32" fill="none" stroke="url(#gold-foil)" stroke-width="2"/>

      <!-- Modern Grid Vector Lines representing UV precision -->
      <line x1="30" y1="160" x2="160" y2="290" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
      <line x1="10" y1="190" x2="140" y2="320" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

      <!-- Personalised Custom Monogram / Name Typography sample -->
      <rect x="35" y="295" width="120" height="36" rx="8" fill="#0F172A" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1"/>
      <text x="95" y="314" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">A . K . M U K A S A</text>
      <text x="95" y="324" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#BAE6FD" text-anchor="middle" letter-spacing="1">CUSTOM UV ART</text>
    </g>

    <!-- Outer Protective Border -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="none" stroke="#334155" stroke-width="3"/>

    <!-- Camera Protection Bezel -->
    <rect x="18" y="20" width="64" height="68" rx="16" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="36" cy="40" r="9.5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="4" fill="#0F172A"/>
    <circle cx="64" cy="40" r="9.5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="4" fill="#0F172A"/>
    <circle cx="36" cy="68" r="9.5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="36" cy="68" r="4" fill="#0F172A"/>
    <circle cx="64" cy="68" r="4" fill="#E2E8F0"/>
  </g>
</svg>
