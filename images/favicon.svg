<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vetroarts Logo Icon">
  <defs>
    <linearGradient id="fav-copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D98A52"/>
      <stop offset="50%" stop-color="#B86B35"/>
      <stop offset="100%" stop-color="#8A461A"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="#18110D"/>

  <!-- Phone Case Outer Bumper Frame -->
  <rect x="18" y="8" width="28" height="48" rx="8" fill="#FFFFFF" stroke="url(#fav-copper)" stroke-width="2.5"/>

  <!-- Reinforced Bumper Corners -->
  <path d="M 17 14 Q 17 8 23 8" fill="none" stroke="url(#fav-copper)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 47 14 Q 47 8 41 8" fill="none" stroke="url(#fav-copper)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 17 50 Q 17 56 23 56" fill="none" stroke="url(#fav-copper)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 47 50 Q 47 56 41 56" fill="none" stroke="url(#fav-copper)" stroke-width="4" stroke-linecap="round"/>

  <!-- Dual Camera Cutout (top left) -->
  <rect x="21" y="11" width="5" height="9" rx="2.5" fill="#18110D"/>
  <circle cx="23.5" cy="13.5" r="1.2" fill="#D98A52"/>
  <circle cx="23.5" cy="17.5" r="1.2" fill="#D98A52"/>

  <!-- Fingerprint Ridges in Copper forming 'O' in center -->
  <g fill="none" stroke="url(#fav-copper)" stroke-width="1.3" stroke-linecap="round">
    <!-- Center Loop (the 'O') -->
    <ellipse cx="33" cy="35" rx="3.5" ry="6.5" stroke-width="1.8"/>
    
    <!-- Inner Ridge 1 -->
    <ellipse cx="33" cy="35" rx="6" ry="9.5"/>
    
    <!-- Middle Ridge 2 -->
    <ellipse cx="33" cy="35" rx="8.5" ry="12.5"/>
    
    <!-- Outer Ridge 3 -->
    <path d="M 23 39 Q 23 20 33 20 Q 43 20 43 39"/>
    <path d="M 25 43 Q 33 49 41 43"/>
  </g>
</svg>
