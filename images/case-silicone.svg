<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="Liquid Silicone Phone Case Mockup">
  <defs>
    <linearGradient id="silicone-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="silicone-body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="soft-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="silicone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="16" fill="url(#silicone-bg)"/>

  <g filter="url(#silicone-shadow)" transform="translate(65, 30)">
    <!-- Silicone Case Shell -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#silicone-body)"/>
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#soft-sheen)"/>

    <!-- Subtle Beveled Edge Rim -->
    <rect x="2" y="2" width="186" height="356" rx="34" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.6"/>

    <!-- Integrated Silicone Camera Protection Island -->
    <rect x="18" y="20" width="64" height="68" rx="18" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <rect x="20" y="22" width="60" height="64" rx="16" fill="none" stroke="#64748B" stroke-width="1" opacity="0.5"/>

    <!-- Camera Lenses with Glossy Reflection -->
    <circle cx="36" cy="40" r="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="4.5" fill="#0284C7" opacity="0.6"/>
    <circle cx="64" cy="40" r="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="4.5" fill="#0284C7" opacity="0.6"/>
    <circle cx="36" cy="68" r="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="36" cy="68" r="4.5" fill="#0284C7" opacity="0.6"/>
    <circle cx="64" cy="68" r="4" fill="#F8FAFC" opacity="0.9"/> <!-- LED Flash -->
    <circle cx="64" cy="78" r="2" fill="#475569"/> <!-- Mic hole -->

    <!-- Debossed subtle tactile accent mark near base -->
    <rect x="85" y="325" width="20" height="3" rx="1.5" fill="#0F172A" opacity="0.5"/>
  </g>
</svg>
