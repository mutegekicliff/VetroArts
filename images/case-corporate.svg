<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="Corporate Branded Phone Case Mockup">
  <defs>
    <linearGradient id="corp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="corp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="silver-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="corp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="16" fill="url(#corp-bg)"/>

  <g filter="url(#corp-shadow)" transform="translate(65, 30)">
    <!-- Case Body -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#corp-body)"/>

    <!-- Subtle Edge Chamfer Line -->
    <rect x="2" y="2" width="186" height="356" rx="34" fill="none" stroke="#334155" stroke-width="1.5"/>

    <!-- Corporate Branding Display Area (Sample Organization Monogram & Name) -->
    <!-- Crest / Emblem -->
    <circle cx="95" cy="180" r="32" fill="#1E293B" stroke="url(#silver-accent)" stroke-width="2"/>
    <polygon points="95,158 115,172 108,196 82,196 75,172" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="95" cy="178" r="6" fill="url(#silver-accent)"/>

    <!-- Corporate Typography -->
    <text x="95" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">ENTERPRISE</text>
    <text x="95" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">CLIENT SAMPLE BRANDING</text>
    <line x1="60" y1="262" x2="130" y2="262" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" fill="#64748B" text-anchor="middle" letter-spacing="1">BULK ORDER PROTOTYPE</text>

    <!-- Camera Protection Bezel -->
    <rect x="18" y="20" width="64" height="68" rx="16" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="36" cy="40" r="9.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="4" fill="#0F172A"/>
    <circle cx="64" cy="40" r="9.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="4" fill="#0F172A"/>
    <circle cx="36" cy="68" r="9.5" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="36" cy="68" r="4" fill="#0F172A"/>
    <circle cx="64" cy="68" r="4" fill="#E2E8F0"/>
  </g>
</svg>
