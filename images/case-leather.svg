<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="Textured Leather Finish Phone Case Mockup">
  <defs>
    <linearGradient id="leath-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="leather-surface" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#271102"/>
    </linearGradient>
    <filter id="leather-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="16" fill="url(#leath-bg)"/>

  <g filter="url(#leather-shadow)" transform="translate(65, 30)">
    <!-- Leather Main Shell -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#leather-surface)" stroke="#271102" stroke-width="2"/>

    <!-- Subtle Grain Texture Effect -->
    <rect x="6" y="6" width="178" height="348" rx="30" fill="none" stroke="#92400E" stroke-width="0.5" opacity="0.3"/>

    <!-- Premium Saddle Stitching Along Perimeter -->
    <rect x="10" y="10" width="170" height="340" rx="28" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.75"/>

    <!-- Debossed Brand Stamp Area (Sample) -->
    <rect x="65" y="305" width="60" height="20" rx="4" fill="#271102" opacity="0.4"/>
    <text x="95" y="318" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#92400E" text-anchor="middle" letter-spacing="1.5">VETROARTS</text>

    <!-- Camera Cutout with Burnished Leather Bevel -->
    <rect x="18" y="20" width="64" height="68" rx="16" fill="#1C0D02" stroke="#B45309" stroke-width="2"/>
    <!-- Stitching around camera -->
    <rect x="22" y="24" width="56" height="60" rx="12" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

    <circle cx="36" cy="40" r="9.5" fill="#090D16" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="4" fill="#0284C7" opacity="0.6"/>
    <circle cx="64" cy="40" r="9.5" fill="#090D16" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="4" fill="#0284C7" opacity="0.6"/>
    <circle cx="36" cy="68" r="9.5" fill="#090D16" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="36" cy="68" r="4" fill="#0284C7" opacity="0.6"/>
    <circle cx="64" cy="68" r="4" fill="#FEF3C7"/>
  </g>
</svg>
