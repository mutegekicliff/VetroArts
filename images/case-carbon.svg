<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" role="img" aria-label="Carbon-Fibre Finish Phone Case Mockup">
  <defs>
    <linearGradient id="carb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="carbon-weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#18181B"/>
      <rect width="4" height="4" fill="#27272A"/>
      <rect x="4" y="4" width="4" height="4" fill="#27272A"/>
      <line x1="0" y1="4" x2="4" y2="4" stroke="#09090B" stroke-width="0.75"/>
      <line x1="4" y1="8" x2="8" y2="8" stroke="#09090B" stroke-width="0.75"/>
      <line x1="4" y1="0" x2="4" y2="4" stroke="#3F3F46" stroke-width="0.75"/>
      <line x1="8" y1="4" x2="8" y2="8" stroke="#3F3F46" stroke-width="0.75"/>
    </pattern>
    <linearGradient id="carbon-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="carb-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="16" fill="url(#carb-bg)"/>

  <g filter="url(#carb-shadow)" transform="translate(65, 30)">
    <!-- Case Shell with Carbon Weave Pattern -->
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#carbon-weave)" stroke="#3F3F46" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="360" rx="36" fill="url(#carbon-sheen)"/>

    <!-- Perimeter Grip Ridges -->
    <rect x="2" y="2" width="186" height="356" rx="34" fill="none" stroke="#27272A" stroke-width="1.5"/>

    <!-- Subtle Technical Specular Highlights -->
    <path d="M 20 40 L 170 300" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" stroke-dasharray="20, 40"/>

    <!-- Camera Protection Frame (Metal look) -->
    <rect x="18" y="20" width="64" height="68" rx="16" fill="#09090B" stroke="#71717A" stroke-width="2"/>
    <circle cx="36" cy="40" r="9.5" fill="#18181B" stroke="#A1A1AA" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="4" fill="#09090B"/>
    <circle cx="64" cy="40" r="9.5" fill="#18181B" stroke="#A1A1AA" stroke-width="1.5"/>
    <circle cx="64" cy="40" r="4" fill="#09090B"/>
    <circle cx="36" cy="68" r="9.5" fill="#18181B" stroke="#A1A1AA" stroke-width="1.5"/>
    <circle cx="36" cy="68" r="4" fill="#09090B"/>
    <circle cx="64" cy="68" r="4" fill="#F4F4F5"/>
  </g>
</svg>
